<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item Mode</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: monospace;
      text-align: center;
      margin: 0;
      padding: 60px 20px;
    }

    #item-container {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 30px;
    }

    #dialogue-box {
      border: 4px solid white;
      padding: 24px;
      min-height: 70px;
      font-size: 18px;
      line-height: 1.5;
      text-align: left;
      margin-bottom: 30px;
      box-sizing: border-box;
    }

    .item-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-bottom: 36px;
    }

    .item-btn {
      background-color: black;
      color: #ff9900;
      border: 2px solid #ff9900;
      font-family: monospace;
      font-size: 16px;
      padding: 10px 18px;
      cursor: pointer;
    }

    .item-btn:hover,
    .item-btn:focus {
      color: yellow;
      border-color: yellow;
      outline: none;
    }

    .back-link {
      color: yellow;
      font-size: 18px;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="item-container">
    <h1>* ¡Entraste a la zona de Objetos (ITEM)!</h1>

    <div id="dialogue-box">* Revisando inventario...</div>

    <div class="item-options">
      <button type="button" class="item-btn" id="btn-revisar">* REVISAR BOLSILLOS</button>
      <button type="button" class="item-btn" id="btn-torta">* TORTA DE ELOTE</button>
      <button type="button" class="item-btn" id="btn-horchata">* AGUA DE HORCHATA</button>
      <button type="button" class="item-btn" id="btn-vendaje">* VENDAJE</button>
    </div>

    <a href="index.html" class="back-link">[ Regresar al menú ]</a>
  </div>

  <script src="script.js"></script>
  <script>
    const cajaDialogo = document.getElementById("dialogue-box");

    function ejecutarAccionPrincipal() {
      if (typeof accion === "function") {
        accion("ITEM");
      } else {
        cajaDialogo.innerHTML = "* Revisas tus bolsillos... ¡Tienes una Torta de Elote!";
      }
    }
    window.addEventListener("DOMContentLoaded", ejecutarAccionPrincipal);

    document.getElementById("btn-revisar").addEventListener("click", ejecutarAccionPrincipal);

    document.getElementById("btn-torta").addEventListener("click", function () {
      cajaDialogo.innerHTML = "* Comes la Torta de Elote. ¡Recuperas 20 HP! Estaba deliciosa.";
    });

    document.getElementById("btn-horchata").addEventListener("click", function () {
      cajaDialogo.innerHTML = "* Bebes un trago de Agua de Horchata. ¡Te sientes lleno de determinación!";
    });

    document.getElementById("btn-vendaje").addEventListener("click", function () {
      cajaDialogo.innerHTML = "* Te colocas el vendaje viejo. Recuperas 10 HP.";
    });
  </script>
</body>
</html>
