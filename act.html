<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Act Mode</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: monospace;
      text-align: center;
      margin: 0;
      padding: 60px 20px;
    }

    #act-container {
      max-width: 640px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 30px;
    }

    /* Caja de diálogo clásica estilo Undertale (conectada con script.js) */
    #dialogue-box {
      border: 4px solid white;
      padding: 24px;
      min-height: 70px;
      font-size: 18px;
      line-height: 1.5;
      text-align: left;
      margin-bottom: 30px;
      box-sizing: border-box;
    }

    .act-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px;
      margin-bottom: 36px;
    }

    .act-btn {
      background-color: black;
      color: #ff9900;
      border: 2px solid #ff9900;
      font-family: monospace;
      font-size: 16px;
      padding: 10px 18px;
      cursor: pointer;
    }

    .act-btn:hover,
    .act-btn:focus {
      color: yellow;
      border-color: yellow;
      outline: none;
    }

    .back-link {
      color: yellow;
      font-size: 18px;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="act-container">
    <h1>* ¡Entraste a la zona de Acción (ACT)!</h1>

    <!-- Elemento utilizado por accion("ACT") en script.js -->
    <div id="dialogue-box">* Preparando acción...</div>

    <!-- Botones didácticos para interactuar en el modo ACT -->
    <div class="act-options">
      <button type="button" class="act-btn" id="btn-analizar">* ANALIZAR</button>
      <button type="button" class="act-btn" id="btn-hablar">* HABLAR</button>
      <button type="button" class="act-btn" id="btn-cumplido">* CUMPLIDO</button>
      <button type="button" class="act-btn" id="btn-bromear">* BROMEAR</button>
    </div>

    <a href="index.html" class="back-link">[ Regresar al menú ]</a>
  </div>

  <!-- Conexión con el archivo principal de lógica -->
  <script src="script.js"></script>
  <script>
    const cajaDialogo = document.getElementById("dialogue-box");

    // Ejecuta la función accion("ACT") definida en script.js
    function ejecutarAccionPrincipal() {
      if (typeof accion === "function") {
        accion("ACT");
      } else {
        // Respaldo en caso de abrir act.html sin script.js en la misma carpeta
        cajaDialogo.innerHTML = "* Miras al enemigo. No hay nada que analizar.";
      }
    }

    // Lanza el diálogo de ACT automáticamente al cargar la pantalla
    window.addEventListener("DOMContentLoaded", ejecutarAccionPrincipal);

    document.getElementById("btn-analizar").addEventListener("click", ejecutarAccionPrincipal);

    document.getElementById("btn-hablar").addEventListener("click", function () {
      cajaDialogo.innerHTML = "* Intentas conversar con el enemigo. Escucha con atención.";
    });

    document.getElementById("btn-cumplido").addEventListener("click", function () {
      cajaDialogo.innerHTML = "* Elogias su postura de combate. ¡Su defensa bajó ligeramente!";
    });

    document.getElementById("btn-bromear").addEventListener("click", function () {
      cajaDialogo.innerHTML = "* Cuentas un chiste malo. El enemigo finge que no le dio risa.";
    });
  </script>
</body>
</html>
